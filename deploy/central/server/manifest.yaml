{
  "apiVersion": "v1",
  "kind": "ServiceAccount",
  "metadata": {
    "name": "numaflow-server-sa",
    "namespace": "numaflow-system"
  }
}
---
{
  "apiVersion": "rbac.authorization.k8s.io/v1",
  "kind": "ClusterRole",
  "metadata": {
    "labels": {
      "app.kubernetes.io/component": "numaflow-ux",
      "app.kubernetes.io/name": "numaflow-ux",
      "app.kubernetes.io/part-of": "numaflow"
    },
    "name": "numaflow-server-role"
  },
  "rules": [
    {
      "apiGroups": [
        "numaflow.numaproj.io"
      ],
      "resources": [
        "interstepbufferservices",
        "interstepbufferservices/status",
        "pipelines",
        "pipelines/status",
        "vertices",
        "vertices/status",
        "vertices/scale",
        "monovertices",
        "monovertices/status",
        "monovertices/scale",
        "servingpipelines",
        "servingpipelines/status"
      ],
      "verbs": [
        "get",
        "list",
        "watch"
      ]
    },
    {
      "apiGroups": [
        ""
      ],
      "resources": [
        "pods",
        "pods/log",
        "configmaps",
        "services",
        "persistentvolumeclaims",
        "namespaces"
      ],
      "verbs": [
        "get",
        "list",
        "watch"
      ]
    },
    {
      "apiGroups": [
        "",
        "events.k8s.io"
      ],
      "resources": [
        "events"
      ],
      "verbs": [
        "get",
        "list",
        "watch"
      ]
    },
    {
      "apiGroups": [
        "apps"
      ],
      "resources": [
        "deployments",
        "statefulsets"
      ],
      "verbs": [
        "get",
        "list",
        "watch"
      ]
    },
    {
      "apiGroups": [
        "metrics.k8s.io"
      ],
      "resources": [
        "pods"
      ],
      "verbs": [
        "get",
        "list",
        "watch"
      ]
    }
  ]
}
---
{
  "apiVersion": "rbac.authorization.k8s.io/v1",
  "kind": "Role",
  "metadata": {
    "name": "numaflow-server-secrets-role",
    "namespace": "numaflow-system"
  },
  "rules": [
    {
      "apiGroups": [
        ""
      ],
      "resourceNames": [
        "numaflow-server-secrets"
      ],
      "resources": [
        "secrets"
      ],
      "verbs": [
        "get",
        "list",
        "watch",
        "create",
        "update",
        "patch"
      ]
    }
  ]
}
---
{
  "apiVersion": "rbac.authorization.k8s.io/v1",
  "kind": "ClusterRoleBinding",
  "metadata": {
    "name": "numaflow-server-binding"
  },
  "roleRef": {
    "apiGroup": "rbac.authorization.k8s.io",
    "kind": "ClusterRole",
    "name": "numaflow-server-role"
  },
  "subjects": [
    {
      "kind": "ServiceAccount",
      "name": "numaflow-server-sa",
      "namespace": "numaflow-system"
    }
  ]
}
---
{
  "apiVersion": "rbac.authorization.k8s.io/v1",
  "kind": "RoleBinding",
  "metadata": {
    "name": "numaflow-server-secrets-binding",
    "namespace": "numaflow-system"
  },
  "roleRef": {
    "apiGroup": "rbac.authorization.k8s.io",
    "kind": "Role",
    "name": "numaflow-server-secrets-role"
  },
  "subjects": [
    {
      "kind": "ServiceAccount",
      "name": "numaflow-server-sa",
      "namespace": "numaflow-system"
    }
  ]
}
---
{
  "apiVersion": "v1",
  "data": {
    "server.disable.auth": "true",
    "server.insecure": "true",
    "server.readonly": "true"
  },
  "kind": "ConfigMap",
  "metadata": {
    "name": "numaflow-cmd-params-config",
    "namespace": "numaflow-system"
  }
}
---
{
  "apiVersion": "v1",
  "data": {
    "rbac-conf.yaml": "policy.default: role:readonly\npolicy.scopes: groups,email,username\n",
    "rbac-policy.csv": "p, role:admin, *, *, *\np, role:readonly, *, *, GET\n"
  },
  "kind": "ConfigMap",
  "metadata": {
    "name": "numaflow-server-rbac-config",
    "namespace": "numaflow-system"
  }
}
---
{
  "apiVersion": "v1",
  "data": {
    "config.yaml": "url: http://prometheus.monitoring.svc.cluster.local:9090\npatterns: []\n"
  },
  "kind": "ConfigMap",
  "metadata": {
    "name": "numaflow-server-metrics-proxy-config",
    "namespace": "numaflow-system"
  }
}
---
{
  "apiVersion": "v1",
  "kind": "Secret",
  "metadata": {
    "name": "numaflow-server-secrets",
    "namespace": "numaflow-system"
  },
  "type": "Opaque"
}
---
{
  "apiVersion": "v1",
  "kind": "Service",
  "metadata": {
    "name": "numaflow-server",
    "namespace": "numaflow-system"
  },
  "spec": {
    "ports": [
      {
        "port": 8443,
        "targetPort": 8443
      }
    ],
    "selector": {
      "app.kubernetes.io/component": "numaflow-ux",
      "app.kubernetes.io/name": "numaflow-ux",
      "app.kubernetes.io/part-of": "numaflow"
    },
    "type": "ClusterIP"
  }
}
---
{
  "apiVersion": "apps/v1",
  "kind": "Deployment",
  "metadata": {
    "name": "numaflow-server",
    "namespace": "numaflow-system"
  },
  "spec": {
    "replicas": 1,
    "selector": {
      "matchLabels": {
        "app.kubernetes.io/component": "numaflow-ux",
        "app.kubernetes.io/name": "numaflow-ux",
        "app.kubernetes.io/part-of": "numaflow"
      }
    },
    "template": {
      "metadata": {
        "labels": {
          "app.kubernetes.io/component": "numaflow-ux",
          "app.kubernetes.io/name": "numaflow-ux",
          "app.kubernetes.io/part-of": "numaflow"
        }
      },
      "spec": {
        "containers": [
          {
            "args": [
              "server"
            ],
            "env": [
              {
                "name": "NAMESPACE",
                "valueFrom": {
                  "fieldRef": {
                    "fieldPath": "metadata.namespace"
                  }
                }
              },
              {
                "name": "NUMAFLOW_SERVER_INSECURE",
                "valueFrom": {
                  "configMapKeyRef": {
                    "key": "server.insecure",
                    "name": "numaflow-cmd-params-config",
                    "optional": true
                  }
                }
              },
              {
                "name": "NUMAFLOW_SERVER_READONLY",
                "valueFrom": {
                  "configMapKeyRef": {
                    "key": "server.readonly",
                    "name": "numaflow-cmd-params-config",
                    "optional": true
                  }
                }
              },
              {
                "name": "NUMAFLOW_SERVER_DISABLE_AUTH",
                "valueFrom": {
                  "configMapKeyRef": {
                    "key": "server.disable.auth",
                    "name": "numaflow-cmd-params-config",
                    "optional": true
                  }
                }
              }
            ],
            "image": "quay.io/numaproj/numaflow:v1.8.0",
            "imagePullPolicy": "IfNotPresent",
            "livenessProbe": {
              "httpGet": {
                "path": "/livez",
                "port": 8443,
                "scheme": "HTTPS"
              },
              "initialDelaySeconds": 3,
              "periodSeconds": 3
            },
            "name": "main",
            "ports": [
              {
                "containerPort": 8443
              }
            ],
            "readinessProbe": {
              "httpGet": {
                "path": "/readyz",
                "port": 8443,
                "scheme": "HTTPS"
              },
              "initialDelaySeconds": 3,
              "periodSeconds": 3
            },
            "resources": {
              "limits": {
                "cpu": "500m",
                "memory": "1024Mi"
              },
              "requests": {
                "cpu": "100m",
                "memory": "200Mi"
              }
            },
            "volumeMounts": [
              {
                "mountPath": "/ui/build/runtime-env.js",
                "name": "env-volume",
                "subPath": "runtime-env.js"
              },
              {
                "mountPath": "/ui/build/index.html",
                "name": "env-volume",
                "subPath": "index.html"
              },
              {
                "mountPath": "/etc/numaflow",
                "name": "rbac-config"
              },
              {
                "mountPath": "/etc/numaflow/metrics-proxy",
                "name": "metrics-proxy-config"
              }
            ]
          }
        ],
        "initContainers": [
          {
            "args": [
              "server-init"
            ],
            "env": [
              {
                "name": "NUMAFLOW_SERVER_BASE_HREF",
                "valueFrom": {
                  "configMapKeyRef": {
                    "key": "server.base.href",
                    "name": "numaflow-cmd-params-config",
                    "optional": true
                  }
                }
              }
            ],
            "image": "quay.io/numaproj/numaflow:v1.8.0",
            "imagePullPolicy": "IfNotPresent",
            "name": "server-init",
            "volumeMounts": [
              {
                "mountPath": "/opt/numaflow",
                "name": "env-volume"
              }
            ]
          },
          {
            "args": [
              "server-secrets-init"
            ],
            "env": [
              {
                "name": "NAMESPACE",
                "valueFrom": {
                  "fieldRef": {
                    "fieldPath": "metadata.namespace"
                  }
                }
              },
              {
                "name": "NUMAFLOW_SERVER_DISABLE_AUTH",
                "valueFrom": {
                  "configMapKeyRef": {
                    "key": "server.disable.auth",
                    "name": "numaflow-cmd-params-config",
                    "optional": true
                  }
                }
              }
            ],
            "image": "quay.io/numaproj/numaflow:v1.8.0",
            "imagePullPolicy": "IfNotPresent",
            "name": "server-secrets-init"
          }
        ],
        "securityContext": {
          "runAsNonRoot": true,
          "runAsUser": 9737
        },
        "serviceAccountName": "numaflow-server-sa",
        "volumes": [
          {
            "emptyDir": {},
            "name": "env-volume"
          },
          {
            "configMap": {
              "name": "numaflow-server-rbac-config"
            },
            "name": "rbac-config"
          },
          {
            "configMap": {
              "name": "numaflow-server-metrics-proxy-config"
            },
            "name": "metrics-proxy-config"
          }
        ]
      }
    }
  }
}
